# Build Yattee (open-source YouTube client, AGPL-3.0) for iOS and upload it to TestFlight.
# Signing: Xcode automatic (cloud) signing with an App Store Connect API key. No Mac, no match repo.
name: TestFlight

on:
  workflow_dispatch:
    inputs:
      yattee_ref:
        description: Yattee branch, tag or commit to build
        default: main

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}   # e.g. com.yourname.yattee
      TEAM_ID: ${{ vars.TEAM_ID }}       # 10-char Apple team ID
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      KEY_PATH: ${{ runner.temp }}/AuthKey.p8
      ARCHIVE: ${{ runner.temp }}/Yattee.xcarchive
    steps:
      - name: Check settings
        run: |
          for v in BUNDLE_ID TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            [ -n "${!v}" ] || { echo "::error::$v is not set"; exit 1; }
          done

      - name: Select newest non-beta Xcode
        # App Store Connect rejects builds made with beta Xcode.
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Get Yattee source
        run: git clone --depth 1 --branch "${{ inputs.yattee_ref }}" https://github.com/yattee/yattee.git src
        # --branch accepts branch or tag names. For a commit SHA, clone without --depth/--branch and git checkout it.

      - name: Rebrand bundle ID, drop iCloud / push / app group
        working-directory: src
        # Those capabilities are tied to Yattee's own team. The app already
        # runs without them (see Yattee/Services/CloudKit/CloudKitAvailability.swift).
        run: |
          grep -rlI 'stream\.yattee\.app' Yattee YatteeShareExtension Yattee.xcodeproj \
            | xargs sed -i '' "s/stream\.yattee\.app/${BUNDLE_ID}/g"
          cat > Yattee/Yattee.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict/></plist>
          EOF

      - name: Write API key
        run: printf '%s' "${{ secrets.ASC_KEY_P8 }}" > "$KEY_PATH"

      - name: Archive
        working-directory: src
        run: |
          xcodebuild archive \
            -project Yattee.xcodeproj -scheme Yattee -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Export and upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
